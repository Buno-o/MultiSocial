name: Build MultiSocial

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSocial-Windows
          path: dist/*.exe
      # Ao enviar uma tag (ex.: v1.1.0), cria a Release usada pelo verificador de atualizações do app
      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MultiSocial-Setup-*.exe
            dist/MultiSocial-*-Portable.exe
